# Matter over Thread Light Demo for M5Stack Core S3
# This project uses ESP-IDF directly, not PlatformIO
# Use idf.py build and idf.py flash to build and deploy
# 
# To build this project:
# 1. Install ESP-IDF v5.1+ 
# 2. Clone ESP Matter repository
# 3. Set ESP_MATTER_PATH environment variable
# 4. Run: idf.py set-target esp32s3
# 5. Run: idf.py build
# 6. Run: idf.py flash

# This file is kept for reference but the project uses CMakeLists.txt structure